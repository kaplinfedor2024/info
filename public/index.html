<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ПРОМО — Сайт в разработке</title>
  
  <!-- 🔥 ЯНДЕКС МЕТРИКА (вставь свой номер вместо XXXXXXXX) -->
  <script type="text/javascript">
    window.yaCounter = null;
    (function(m,e,t,r,i,k,a){
      m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
      m[i].l=1*new Date();
      for (var j = 0; j < document.scripts.length; j++) {
        if (document.scripts[j].src === r) { return; }
      }
      k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)
    })(window, document,"script","https://mc.yandex.ru/metrika/tag.js", "ym");

    // ЗАМЕНИ XXXXXXXX НА СВОЙ НОМЕР СЧЁТЧИКА
    ym(113247286, "init", {
      webvisor: true,
      tracklinks: true,
      accurateTrackBounce: true,
      trackHash: true,
      ut: "noindex"
    });
  </script>
  <noscript>
    <div>
      <img src="https://mc.yandex.ru/watch/113247286" style="position:absolute; left:-9999px;" alt="" />
    </div>
  </noscript>
  <!-- 🔥 КОНЕЦ ЯНДЕКС МЕТРИКИ -->

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: 'Arial', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      text-align: center;
      color: white;
      padding: 40px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }

    h1 {
      font-size: 64px;
      margin-bottom: 20px;
      animation: glow 2s ease-in-out infinite alternate;
      letter-spacing: 5px;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #667eea; }
      to { text-shadow: 0 0 20px #fff, 0 0 30px #667eea, 0 0 40px #764ba2; }
    }

    p {
      font-size: 24px;
      margin-bottom: 30px;
      opacity: 0.9;
    }

    .counter-box {
      background: rgba(255, 255, 255, 0.2);
      padding: 20px 40px;
      border-radius: 15px;
      margin: 30px 0;
      display: inline-block;
    }

    .counter-label {
      font-size: 18px;
      margin-bottom: 10px;
      opacity: 0.8;
    }

    .counter {
      font-size: 48px;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
    }

    .btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      padding: 18px 50px;
      font-size: 22px;
      border-radius: 50px;
      cursor: pointer;
      margin-top: 20px;
      transition: all 0.3s ease;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
      font-weight: bold;
      letter-spacing: 1px;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }

    .btn:active {
      transform: translateY(-1px);
    }

    .btn:disabled {
      background: rgba(255, 255, 255, 0.3);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .fish {
      font-size: 60px;
      animation: swim 4s ease-in-out infinite;
      display: inline-block;
    }

    @keyframes swim {
      0%, 100% { transform: translateX(-30px) rotate(-10deg); }
      50% { transform: translateX(30px) rotate(10deg); }
    }

    .emoji-rain {
      position: fixed;
      top: -50px;
      font-size: 30px;
      animation: fall 4s linear infinite;
    }

    @keyframes fall {
      to { transform: translateY(110vh) rotate(360deg); }
    }

    .success-message {
      display: none;
      margin-top: 20px;
      font-size: 20px;
      color: #4ade80;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="fish">🎣</div>
    <h1>ПРОМО</h1>
    <p>Сайт в разработке</p>
    
    <div class="counter-box">
      <div class="counter-label">Посетителей кликнуло:</div>
      <div class="counter" id="counter">0</div>
    </div>
    
    <br>
    
    <button class="btn" id="visitBtn">Я ПОСЕТИТЕЛЬ</button>
    
    <div class="success-message" id="successMsg">
      ✅ Спасибо за визит!
    </div>
  </div>

  <script>
    // 📊 СЧЁТЧИК КЛИКОВ (общий для всех через Яндекс.Метрику)
    const counterEl = document.getElementById('counter');
    const btn = document.getElementById('visitBtn');
    const successMsg = document.getElementById('successMsg');

    // Проверяем, нажимал ли уже пользователь
    const hasVisited = localStorage.getItem('hasVisited');

    // Загружаем счётчик (из localStorage, потом обновим с сервера)
    let count = localStorage.getItem('clickCount') || 0;
    counterEl.textContent = count;

    // Если уже нажимал — блокируем кнопку
    if (hasVisited === 'true') {
      btn.disabled = true;
      btn.textContent = 'Уже посещал';
      successMsg.style.display = 'block';
    }

    // Обработка клика
    btn.addEventListener('click', () => {
      // Увеличиваем счётчик
      count = parseInt(count) + 1;
      localStorage.setItem('clickCount', count);
      counterEl.textContent = count;

      // Отправляем событие в Яндекс.Метрику
      if (window.ym) {
        ym(113247286, 'reachGoal', 'button_click'); // ЗАМЕНИ XXXXXXXX
      }

      // Помечаем, что пользователь уже нажал
      localStorage.setItem('hasVisited', 'true');

      // Блокируем кнопку
      btn.disabled = true;
      btn.textContent = 'Уже посещал';

      // Показываем сообщение
      successMsg.style.display = 'block';

      // Салют из эмодзи
      for (let i = 0; i < 20; i++) {
        setTimeout(createEmoji, i * 50);
      }
    });

    // Падающие эмодзи
    function createEmoji() {
      const emojis = ['🎣', '⭐', '🎉', '💎', '🐟'];
      const emoji = document.createElement('div');
      emoji.className = 'emoji-rain';
      emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      emoji.style.left = Math.random() * 100 + 'vw';
      emoji.style.animationDuration = (Math.random() * 2 + 3) + 's';
      document.body.appendChild(emoji);

      setTimeout(() => emoji.remove(), 5000);
    }

    setInterval(createEmoji, 300);

    // 🔥 ОБНОВЛЕНИЕ СЧЁТЧИКА ИЗ ЯНДЕКС МЕТРИКИ (каждые 5 сек)
    setInterval(() => {
      if (window.ym && window.yaCounter) {
        // Получаем данные из Метрики (цель "button_click")
        ym(113247286, 'getReachGoal', 'button_click', (data) => {
          if (data && data.value) {
            counterEl.textContent = data.value;
            localStorage.setItem('clickCount', data.value);
          }
        });
      }
    }, 5000);
  </script>
</body>
</html>
